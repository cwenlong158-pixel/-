name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ArtemSBulgakov/buildozer-action@v1
        with:
          buildozer_spec: buildozer.spec
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          path: bin/*.apk
